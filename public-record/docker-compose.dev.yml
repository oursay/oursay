# public-record local/dev stack.
#
#   immudb    -> public, verifiable, append-only chain (stores hash commitments only)
#                reached over the PostgreSQL wire protocol (immudb 1.11.0)
#   postgres  -> private, MUTABLE store (record_tx event log + raw content + salt) — erasable
#   evm       -> Hardhat JSON-RPC (SettlementAnchor); always started with the stack
#   evm-deploy / worker -> opt-in via compose profile `worker` (AUTO_START_WORKER=1 on db:up)
#
# Compose project: oursay-dev-public-record.
# Host ports match package defaults (PG :5442, immudb pg-wire :5443, Hardhat :8545) and are offset from
# immudb-test (5432/5433) and the integration-test stack (5444/5445) so all can run at once.
services:
  # immudb 1.11.0 over the PostgreSQL wire protocol — the modern, maintained path.
  # Verification is available as SQL functions: immudb_state(), immudb_verify_row().
  immudb:
    image: codenotary/immudb:1.11.0
    container_name: oursay-dev-public-record-immudb
    environment:
      IMMUDB_ADDRESS: "0.0.0.0"
      IMMUDB_PGSQL_SERVER: "true"
    ports:
      - "5443:5432" # PostgreSQL wire protocol
      - "8082:8080" # web console
    volumes:
      - immudb-data:/var/lib/immudb
    healthcheck:
      test: ["CMD", "immuadmin", "status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # PostGIS image (superset of postgres:16) — @oursay/geo enables `CREATE EXTENSION postgis` for
  # district boundary geometry. Switching the image needs a one-time `docker compose down -v` to
  # re-pull (the named volume keeps data; the extension is created idempotently by GeoStore.init()).
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: oursay-dev-public-record-pg
    environment:
      POSTGRES_USER: oursay
      POSTGRES_PASSWORD: oursay
      POSTGRES_DB: oursay_public_record
    ports:
      - "5442:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oursay -d oursay_public_record"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # Local Hardhat node for SettlementAnchor (JSON-RPC on host :8545).
  evm:
    build:
      context: ..
      dockerfile: evm-anchor/Dockerfile.node
    container_name: oursay-dev-public-record-evm
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(j=>{if(!j.result)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot deploy of SettlementAnchor; writes public-record/.evm/address for the worker.
  evm-deploy:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: evm-anchor/Dockerfile.node
    container_name: oursay-dev-public-record-evm-deploy
    depends_on:
      evm:
        condition: service_healthy
    environment:
      EVM_RPC_URL: http://evm:8545
    volumes:
      - ./.evm:/repo/public-record/.evm
    working_dir: /repo
    entrypoint: ["npm", "run", "deploy:local", "-w", "@oursay/evm-anchor"]
    restart: "no"

  # Settlement worker — opt-in via compose profile `worker` (AUTO_START_WORKER=1 on db:up).
  # Single proposer per chain; do not also run `npm run worker` on the host against the same stack.
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: public-record/Dockerfile.worker
    container_name: oursay-dev-public-record-worker
    depends_on:
      postgres:
        condition: service_healthy
      immudb:
        condition: service_healthy
      evm:
        condition: service_healthy
      evm-deploy:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: oursay
      PGPASSWORD: oursay
      PGDATABASE: oursay_public_record
      IMMUDB_PG_HOST: immudb
      IMMUDB_PG_PORT: "5432"
      IMMUDB_PG_USER: immudb
      IMMUDB_PG_PASSWORD: immudb
      IMMUDB_PG_DATABASE: defaultdb
      FILE_ANCHOR_DIR: /repo/public-record/.anchors
      FILE_ANCHOR_EVERY_BLOCKS: "1"
      EVM_ANCHOR_EVERY_BLOCKS: "2"
      EVM_RPC_URL: http://evm:8545
      EVM_ANCHOR_ADDRESS_FILE: /repo/public-record/.evm/address
      WORKER_CHAIN_IDS: oursay-global,ab-ca-gov
    volumes:
      # Persist anchors on the host (not container-ephemeral).
      - ./.anchors:/repo/public-record/.anchors
      - ./.evm:/repo/public-record/.evm
    restart: unless-stopped

volumes:
  immudb-data:
    name: oursay_dev_public_record_immudb
  pg-data:
    name: oursay_dev_public_record_pg
