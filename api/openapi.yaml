openapi: 3.0.3
info:
  title: OurSay Account API
  description: Account registration & authentication. Email OTP is
    bootstrap/recovery only; WebAuthn passkeys are the day-to-day login. These
    passkeys are the ACCOUNT-LOGIN factor and are separate from the civic
    thread-signing keys in @oursay/public-record.
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token
    cookieAuth:
      type: apiKey
      in: cookie
      name: oursay_session
  schemas: {}
paths:
  /healthz:
    get:
      summary: Health check
      tags:
        - meta
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  db:
                    type: string
                required:
                  - status
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  db:
                    type: string
                required:
                  - status
  /v1/auth/otp/request:
    post:
      summary: Request an email one-time code (registration, recovery, or gated login)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                  enum:
                    - registration
                    - recovery
                    - login
                  default: registration
              required:
                - email
              additionalProperties: false
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - sent
                  expiresAt:
                    type: string
                    format: date-time
                    description: UTC instant after which the issued code is invalid (matches
                      OTP_TTL_SEC).
                required:
                  - status
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/otp/verify:
    post:
      summary: Verify a registration code with a profile body to create the account
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 1
                profile:
                  type: object
                  description: "Least-resistance registration (C3): handle + over-18 checkbox
                    required; everything else optional behind a helper (the KYC
                    step collects missing name/address before verification). No
                    date of birth."
                  properties:
                    handle:
                      type: string
                      description: REQUIRED unique username (wire form, no @). Letters, digits,
                        hyphens, underscores; 1–30 chars.
                    displayName:
                      type: string
                      description: Optional public display text; falls back to the handle without its
                        '@'.
                    over18:
                      type: boolean
                      description: Self-attested 18+ checkbox (must be true). KYC re-verifies; no DOB
                        is stored.
                    firstName:
                      type: string
                      description: Optional private PII (KYC); never publicly surfaced.
                    lastName:
                      type: string
                      description: Optional private PII (KYC); never publicly surfaced.
                    address:
                      type: object
                      description: Address components (Canada-centric storage; the front-end owns
                        localized labels). No district binding is stored.
                      properties:
                        line1:
                          type: string
                        line2:
                          type: string
                        city:
                          type: string
                        province:
                          type: string
                          description: Province/territory.
                        postalCode:
                          type: string
                        country:
                          type: string
                          description: ISO country code; defaults to CA.
                        memo:
                          type: string
                          description: Free field for jurisdiction-specific edge cases.
                      additionalProperties: false
                  required:
                    - handle
                    - over18
                  additionalProperties: false
              required:
                - email
                - code
                - profile
              additionalProperties: false
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  session:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Opaque bearer token (also set as an HttpOnly cookie).
                      scope:
                        type: string
                        enum:
                          - full
                          - registration
                          - recovery
                          - login
                      userId:
                        type: string
                        format: uuid
                      expiresAt:
                        type: string
                        format: date-time
                    required:
                      - token
                      - scope
                      - userId
                      - expiresAt
                required:
                  - userId
                  - session
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/passkey/register/options:
    post:
      summary: Begin passkey enrollment (returns WebAuthn creation options)
      tags:
        - passkey
      security: &a1
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/passkey/register/verify:
    post:
      summary: Complete passkey enrollment (store the credential)
      tags:
        - passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: object
                  additionalProperties: true
                label:
                  type: string
              required:
                - response
              additionalProperties: false
      security: *a1
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                required:
                  - credentialId
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/passkeys:
    get:
      summary: List the caller's enrolled account-login passkeys (devices)
      tags:
        - passkey
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Stable id used to revoke this passkey.
                        label:
                          type: string
                          nullable: true
                          description: User label, or a server-resolved default when unset.
                        transports:
                          type: string
                          nullable: true
                          description: CSV of authenticator transports.
                        createdAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type: string
                          format: date-time
                          nullable: true
                      required:
                        - id
                        - label
                        - transports
                        - createdAt
                        - lastUsedAt
                required:
                  - passkeys
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/passkey/label:
