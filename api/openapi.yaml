      summary: Rename one of the caller's passkeys
      tags:
        - passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                label:
                  type: string
                  nullable: true
              required:
                - id
                - label
              additionalProperties: false
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkey:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Stable id used to revoke this passkey.
                      label:
                        type: string
                        nullable: true
                        description: User label, or a server-resolved default when unset.
                      transports:
                        type: string
                        nullable: true
                        description: CSV of authenticator transports.
                      createdAt:
                        type: string
                        format: date-time
                      lastUsedAt:
                        type: string
                        format: date-time
                        nullable: true
                    required:
                      - id
                      - label
                      - transports
                      - createdAt
                      - lastUsedAt
                required:
                  - passkey
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/passkey/revoke:
    post:
      summary: Remove one of the caller's passkeys (kick a compromised/retired device)
      tags:
        - passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
              required:
                - id
              additionalProperties: false
      security: *a1
      responses:
        "204":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/passkey/login/options:
    post:
      summary: Begin passkey login (returns WebAuthn request options)
      tags:
        - passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/auth/passkey/login/verify:
    post:
      summary: Complete passkey login (assertion → session)
      tags:
        - passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: object
                  additionalProperties: true
              required:
                - response
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  session:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Opaque bearer token (also set as an HttpOnly cookie).
                      scope:
                        type: string
                        enum:
                          - full
                          - registration
                          - recovery
                          - login
                      userId:
                        type: string
                        format: uuid
                      expiresAt:
                        type: string
                        format: date-time
                    required:
                      - token
                      - scope
                      - userId
                      - expiresAt
                required:
                  - userId
                  - session
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/session:
    get:
      summary: Describe the current session
      tags:
        - auth
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  scope:
                    type: string
                    enum:
                      - full
                      - recovery
                required:
                  - userId
                  - scope
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/logout:
    post:
      summary: Revoke the current session
      tags:
        - auth
      security: *a1
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/recovery/verify:
    post:
      summary: Verify a recovery code (unverified → recovery session; verified → KYC
        re-verification required)
      tags:
        - recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 1
              required:
                - email
                - code
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - passkey_reenroll
                  userId:
                    type: string
                    format: uuid
                  session:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Opaque bearer token (also set as an HttpOnly cookie).
                      scope:
                        type: string
                        enum:
                          - full
                          - registration
                          - recovery
                          - login
                      userId:
                        type: string
                        format: uuid
                      expiresAt:
                        type: string
                        format: date-time
                    required:
                      - token
                      - scope
                      - userId
                      - expiresAt
                required:
                  - status
                  - userId
                  - session
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/login/enable:
    post:
      summary: Authorize cross-device login from a trusted device (sends a login OTP
        to the account email)
      tags:
        - login
      description: Requires a full session AND at least one enrolled passkey. Opens a
        short-lived login window (TTL = OTP_TTL_SEC) and emails a one-time code
        to sign in on another device.
      security: *a1
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - sent
                  expiresAt:
                    type: string
                    format: date-time
                    description: UTC instant after which the issued code is invalid (matches
                      OTP_TTL_SEC).
                required:
                  - status
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/auth/login/verify:
    post:
      summary: Complete cross-device login (login OTP → limited enroll-only session)
      tags:
        - login
      description: Succeeds only if a login window was opened from a trusted device.
        Issues a 'login'-scoped session that may enroll a passkey; full access
        comes from the subsequent passkey login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 1
              required:
                - email
                - code
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - passkey_enroll
                  userId:
                    type: string
                    format: uuid
                  session:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Opaque bearer token (also set as an HttpOnly cookie).
                      scope:
                        type: string
                        enum:
                          - full
                          - registration
                          - recovery
                          - login
                      userId:
                        type: string
                        format: uuid
                      expiresAt:
                        type: string
                        format: date-time
                    required:
                      - token
                      - scope
                      - userId
                      - expiresAt
                required:
                  - status
                  - userId
                  - session
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
  /v1/civic/devices:
    post:
      summary: "[deprecated] Enrol a civic device key (not used by the WebAuthn
