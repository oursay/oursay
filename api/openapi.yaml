  /v1/public/feed:
    get:
      summary: "Unified feed: every root type across jurisdictions, newest first,
        cursor-paginated. Viewer-optional — a presented session resolves
        identity reveal + authorGeo; anonymous gets personas."
      tags:
        - public
      parameters:
        - schema:
            anyOf:
              - type: string
                enum:
                  - post
                  - petition
                  - poll
                  - result
              - type: array
                items:
                  type: string
                  enum:
                    - post
                    - petition
                    - poll
                    - result
          in: query
          name: types
          required: false
          description: Root type filter; repeatable. Absent = all four.
        - schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          in: query
          name: jurisdictions
          required: false
          description: Jurisdiction id filter; repeatable. Absent = all.
        - schema:
            type: integer
            minimum: 0
            maximum: 3
            default: 0
          in: query
          name: tierMin
          required: false
          description: "Author verification floor: 0 any · 1 identity · 2 residency · 3
            official (role)."
        - schema:
            type: integer
            minimum: 0
            maximum: 3
            default: 0
          in: query
          name: signedMin
          required: false
          description: "Envelope sign-tier floor: 0 any · 1 passkey (2/3 future)."
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: Opaque page cursor from the previous response's nextCursor.
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: FeedItem-shaped row (web-app CONTRACT.md §1 + Part 3). Jurisdiction
                        is an ID (labels resolve client-side);
                        appliesToDistrictIds is the served name for the affected
                        seat slugs (the adapter maps it to the mock's
                        `districts`); raw author districts NEVER appear —
                        authorGeo is the only residence signal (C6).
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - post
                            - petition
                            - poll
                            - result
                        jurisdiction:
                          type: string
                          description: Jurisdiction id, e.g. "oursay-global" | "ab-ca-gov".
                        tier:
                          type: string
                          enum:
                            - unverified
                            - identity_verified
                            - residency_verified
                            - electoral_validated
                          description: Author's canonical KYC tier token (client maps to its numeric
                            ladder).
                        official:
                          type: boolean
                          description: Author holds the official ROLE in this jurisdiction (never a tier).
                        signTier:
                          type: integer
                          description: "Envelope sign-tier projection: 0 quick · 1 passkey (2/3 future)."
                        appliesToDistrictIds:
                          type: array
                          items:
                            type: string
                          description: Affected seat slugs; [] = jurisdiction-wide.
                        author:
                          type: string
                          description: "Anonymized display: real name when revealed, persona otherwise."
                        handle:
                          type: string
                          description: Real @handle when revealed; the persona name otherwise.
                        identity:
                          type: object
                          description: "Viewer-resolved author identity (docs/09): real name/handle iff
                            the author's effective visibility admits this
                            viewer; the per-thread persona otherwise (handle
                            null — never leaked). Self always resolves revealed,
                            with a seenByOthersAs persona hint when not publicly
                            visible."
                          properties:
                            display:
                              type: string
                            handle:
                              type: string
                              nullable: true
                              description: Real @handle iff revealed or self; null for personas.
                            isPersona:
                              type: boolean
                            isSelf:
                              type: boolean
                            seed:
                              type: string
                              description: "Avatar seed: real handle when revealed, persona name otherwise."
                            threadId:
                              type: string
                            seenByOthersAs:
                              type: string
                              description: Self only, when own effective visibility is not public.
                          required:
                            - display
                            - handle
                            - isPersona
                            - isSelf
                            - seed
                            - threadId
                        authorGeo:
                          type: string
                          enum:
                            - none
                            - home
                            - affected
                            - jurisdiction
                          description: The author's narrowest viewer-relative spatial relation (C6) — the
                            ONLY residence signal served.
                        title:
                          type: string
                        body:
                          type: array
                          items:
                            type: string
                          description: Paragraphs.
                        withheld:
                          type: boolean
                          description: Content redacted/erased — title/body empty, the row provably
                            present.
                        up:
                          type: integer
                        down:
                          type: integer
                        sig:
                          type: integer
                          nullable: true
                          description: Signature count; null when withheld/tier-gated by count policy.
                        goal:
                          type: integer
                          nullable: true
                          description: Graduation threshold when the jurisdiction sets a fixed one.
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                              v:
                                type: integer
                                nullable: true
                                description: Null when the jurisdiction's count policy withholds/tier-gates
                                  votes.
                            required:
                              - label
                              - v
                        attachedPoll:
                          type: object
                          nullable: true
                          properties:
                            question:
                              type: string
                            options:
                              type: array
                              items:
                                type: string
                          required:
                            - question
                            - options
                        comments:
                          type: integer
                          description: Live comment count, all nesting depths.
                        edits:
                          type: integer
                          description: Revision count (update transactions).
                        ts:
                          type: string
                          description: Original create time, ISO.
                      required:
                        - id
                        - type
                        - jurisdiction
                        - tier
                        - official
                        - signTier
                        - appliesToDistrictIds
                        - author
                        - handle
                        - identity
                        - authorGeo
                        - title
                        - body
                        - withheld
                        - comments
                        - edits
                        - ts
                  nextCursor:
                    type: string
                    nullable: true
                    description: Pass back as `cursor`; null = no more rows.
                required:
                  - items
                  - nextCursor
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
